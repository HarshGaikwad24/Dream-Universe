<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dream Universe · Car Details</title>

    <!-- ─── Favicon (globe-icon.png) ─── -->
    <link rel="icon" type="image/png" href="globe-icon.png" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,900;1,400&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

    <style>
        /* ─── Reset & Base ─── */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --gold: #c9a94e;
            --gold-light: #e8d48b;
            --gold-dark: #a8892e;
            --gold-glow: rgba(201, 169, 78, 0.25);
            --bg-dark: #0b0a0a;
            --bg-card: rgba(14, 14, 18, 0.92);
            --bg-sidebar: rgba(8, 8, 10, 0.96);
            --text-light: #f1efe8;
            --text-muted: rgba(255, 255, 255, 0.55);
            --text-dim: rgba(255, 255, 255, 0.25);
            --border-gold: rgba(201, 169, 78, 0.15);
            --card-border: rgba(255, 255, 255, 0.04);
            --shadow-card: 0 8px 32px rgba(0, 0, 0, 0.5);
            --radius: 16px;
            --transition: 0.25s ease;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-dark);
            color: var(--text-light);
            display: flex;
            min-height: 100vh;
            overflow-x: hidden;
        }

        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-dark);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--gold-dark);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--gold);
        }

        /* ─── Background ─── */
        .bg-layer {
            position: fixed;
            inset: 0;
            z-index: 0;
            background:
                radial-gradient(ellipse at 30% 20%, rgba(30, 20, 10, 0.40) 0%, rgba(0, 0, 0, 0.92) 90%),
                radial-gradient(ellipse at 0% 50%, rgba(201, 169, 78, 0.04) 0%, transparent 70%),
                url('speed.jpeg') center center / cover no-repeat fixed;
        }
        .bg-layer::after {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at center, transparent 40%, rgba(0, 0, 0, 0.60) 100%);
            pointer-events: none;
        }

        /* ─── Sidebar ─── */
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: 260px;
            height: 100vh;
            background: var(--bg-sidebar);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-right: 1px solid var(--card-border);
            padding: 1.8rem 1.2rem;
            display: flex;
            flex-direction: column;
            z-index: 100;
            transition: transform 0.3s ease;
            overflow-y: auto;
        }

        .sidebar-brand {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--card-border);
        }

        .sidebar-brand .icon {
            font-size: 1.6rem;
            color: var(--gold);
            filter: drop-shadow(0 0 12px var(--gold-glow));
        }

        .sidebar-brand h1 {
            font-family: 'Playfair Display', serif;
            font-weight: 700;
            font-size: 1.1rem;
            letter-spacing: 0.04em;
            background: linear-gradient(135deg, var(--gold-light), var(--gold), var(--gold-dark));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.2;
        }

        .sidebar-brand small {
            font-size: 0.5rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--text-muted);
            -webkit-text-fill-color: var(--text-muted);
            display: block;
            font-weight: 400;
            margin-top: -0.1rem;
        }

        .sidebar-nav {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 0.2rem;
        }

        .sidebar-nav .nav-label {
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: var(--text-dim);
            padding: 0.8rem 0.8rem 0.3rem;
            font-weight: 600;
        }

        .sidebar-nav a {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            padding: 0.65rem 0.9rem;
            border-radius: 12px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.82rem;
            font-weight: 500;
            transition: background 0.2s ease, color 0.2s ease;
            cursor: pointer;
        }

        .sidebar-nav a i {
            width: 20px;
            font-size: 0.95rem;
            text-align: center;
            flex-shrink: 0;
        }

        .sidebar-nav a:hover {
            background: rgba(201, 169, 78, 0.06);
            color: var(--text-light);
        }

        .sidebar-nav a.active {
            background: rgba(201, 169, 78, 0.10);
            color: var(--gold-light);
            box-shadow: inset 0 0 0 1px rgba(201, 169, 78, 0.08);
        }

        .sidebar-nav a .badge {
            margin-left: auto;
            background: var(--gold-dark);
            color: #0b0a0a;
            font-size: 0.6rem;
            font-weight: 700;
            padding: 0.1rem 0.5rem;
            border-radius: 20px;
        }

        .sidebar-footer {
            margin-top: auto;
            padding-top: 1rem;
            border-top: 1px solid var(--card-border);
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }

        .sidebar-footer .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--gold-dark), var(--gold));
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.9rem;
            color: #0b0a0a;
        }

        .sidebar-footer .info {
            flex: 1;
        }

        .sidebar-footer .info .name {
            font-size: 0.8rem;
            font-weight: 600;
        }

        .sidebar-footer .info .role {
            font-size: 0.65rem;
            color: var(--text-muted);
        }

        .sidebar-footer .logout {
            color: var(--text-dim);
            transition: color 0.2s ease;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .sidebar-footer .logout:hover {
            color: #e74c3c;
        }

        /* ─── Hamburger ─── */
        .hamburger {
            display: none;
            position: fixed;
            top: 1rem;
            left: 1rem;
            z-index: 101;
            background: var(--bg-card);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 0.5rem 0.7rem;
            color: var(--text-light);
            font-size: 1.3rem;
            cursor: pointer;
            backdrop-filter: blur(8px);
            transition: background 0.2s ease;
        }

        .hamburger:hover {
            background: rgba(255, 255, 255, 0.06);
        }

        .sidebar-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 99;
        }
        .sidebar-overlay.active {
            display: block;
        }

        /* ─── Main Content ─── */
        .main {
            margin-left: 260px;
            flex: 1;
            padding: 1.8rem 2.2rem 3rem;
            min-height: 100vh;
            position: relative;
            z-index: 1;
        }

        /* ─── Top Bar ─── */
        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .topbar-left h2 {
            font-family: 'Playfair Display', serif;
            font-weight: 600;
            font-size: 1.6rem;
        }

        .topbar-left h2 span {
            color: var(--gold);
        }

        .topbar-left p {
            color: var(--text-muted);
            font-size: 0.85rem;
            font-weight: 300;
        }

        .topbar-right {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .topbar-right .date-badge {
            background: var(--bg-card);
            border: 1px solid var(--card-border);
            border-radius: 30px;
            padding: 0.4rem 1.2rem;
            font-size: 0.8rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .topbar-right .date-badge i {
            color: var(--gold);
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.85rem;
            transition: color 0.2s ease;
        }

        .back-link:hover {
            color: var(--gold-light);
        }

        /* ─── Car Detail Grid ─── */
        .detail-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
        }

        .panel {
            background: var(--bg-card);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid var(--card-border);
            border-radius: var(--radius);
            padding: 1.2rem 1.4rem 1.6rem;
            box-shadow: var(--shadow-card);
        }

        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 0.8rem;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .panel-header h3 {
            font-family: 'Playfair Display', serif;
            font-weight: 600;
            font-size: 1.1rem;
        }

        /* ─── Info Rows ─── */
        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 0.5rem 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .info-row .label {
            color: var(--text-muted);
            font-size: 0.8rem;
        }

        .info-row .value {
            font-weight: 500;
            font-size: 0.85rem;
        }

        .info-row .value.gold {
            color: var(--gold-light);
        }

        /* ─── Car Image ─── */
        .car-image-large {
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            background: #1a1818;
            border: 1px solid var(--card-border);
            margin-bottom: 0.5rem;
        }

        .car-image-large img {
            width: 100%;
            height: 280px;
            object-fit: cover;
            display: block;
        }

        .status-badge {
            display: inline-block;
            padding: 0.2rem 0.8rem;
            border-radius: 20px;
            font-size: 0.65rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .status-badge.available {
            background: rgba(46, 204, 113, 0.15);
            color: #2ecc71;
        }

        .status-badge.booked {
            background: rgba(241, 196, 15, 0.15);
            color: #f1c40f;
        }

        .status-badge.maintenance {
            background: rgba(231, 76, 60, 0.15);
            color: #e74c3c;
        }

        .action-buttons {
            display: flex;
            gap: 0.6rem;
            flex-wrap: wrap;
            margin-top: 0.5rem;
        }

        .action-buttons a,
        .action-buttons button {
            padding: 0.5rem 1.2rem;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 0.8rem;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.35s ease;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            text-decoration: none;
        }

        .action-buttons a:hover,
        .action-buttons button:hover {
            transform: translateY(-2px);
        }

        .action-buttons .btn-edit {
            background: linear-gradient(135deg, #2980b9, #3498db);
            color: #fff;
            box-shadow: 0 4px 16px rgba(52, 152, 219, 0.15);
        }

        .action-buttons .btn-edit:hover {
            box-shadow: 0 8px 30px rgba(52, 152, 219, 0.25);
        }

        .action-buttons .btn-delete {
            background: linear-gradient(135deg, #c0392b, #e74c3c);
            color: #fff;
            box-shadow: 0 4px 16px rgba(231, 76, 60, 0.15);
        }

        .action-buttons .btn-delete:hover {
            box-shadow: 0 8px 30px rgba(231, 76, 60, 0.25);
        }

        .action-buttons .btn-toggle {
            background: linear-gradient(135deg, var(--gold-dark), var(--gold), var(--gold-light));
            color: #0b0a0a;
            box-shadow: 0 4px 16px rgba(201, 169, 78, 0.15);
        }

        .action-buttons .btn-toggle:hover {
            box-shadow: 0 8px 30px rgba(201, 169, 78, 0.25);
        }

        /* ─── No Data ─── */
        .no-data {
            text-align: center;
            padding: 3rem 1rem;
            color: var(--text-muted);
        }

        .no-data i {
            font-size: 3rem;
            color: var(--text-dim);
            display: block;
            margin-bottom: 1rem;
        }

        .no-data h3 {
            font-family: 'Playfair Display', serif;
            font-weight: 600;
            font-size: 1.2rem;
            color: var(--text-light);
            margin-bottom: 0.3rem;
        }

        .no-data a {
            color: var(--gold-light);
            text-decoration: none;
        }

        .no-data a:hover {
            text-decoration: underline;
        }

        .description-text {
            color: var(--text-muted);
            font-size: 0.9rem;
            line-height: 1.6;
            padding: 0.3rem 0;
        }

        /* ─── Toast ─── */
        .toast {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-gold);
            padding: 0.7rem 2rem;
            border-radius: 40px;
            color: var(--text-light);
            font-weight: 500;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
            z-index: 2000;
            opacity: 0;
            transition: opacity 0.4s ease, transform 0.4s ease;
            pointer-events: none;
            font-size: 0.9rem;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ─── Responsive ─── */
        @media (max-width: 1024px) {
            .detail-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(-100%);
                width: 280px;
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .hamburger {
                display: block;
            }

            .main {
                margin-left: 0;
                padding: 1.2rem 1rem 2rem;
            }

            .topbar-left h2 {
                font-size: 1.2rem;
            }

            .panel {
                padding: 1rem;
            }

            .car-image-large img {
                height: 180px;
            }

            .action-buttons {
                flex-direction: column;
            }

            .action-buttons a,
            .action-buttons button {
                width: 100%;
                justify-content: center;
            }
        }

        @media (max-width: 480px) {
            .topbar-right .date-badge {
                display: none;
            }
            .sidebar {
                width: 100%;
                max-width: 320px;
            }
        }
    </style>
</head>
<body>

    <!-- ─── Background ─── -->
    <div class="bg-layer"></div>

    <!-- ─── Hamburger ─── -->
    <button class="hamburger" id="hamburger" aria-label="Toggle menu">
        <i class="fas fa-bars"></i>
    </button>

    <!-- ─── Sidebar Overlay ─── -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- ─── Sidebar ─── -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-brand">
            <span class="icon">✦</span>
            <div>
                <h1>Dream Universe</h1>
                <small>Admin Panel</small>
            </div>
        </div>

        <nav class="sidebar-nav">
            <div class="nav-label">Main</div>
            <a href="admin dashboard.html" data-page="dashboard">
                <i class="fas fa-th-large"></i> Dashboard
            </a>
            <a href="manage-cars.html" data-page="cars" class="active">
                <i class="fas fa-car"></i> Cars
                <span class="badge" id="carBadge">0</span>
            </a>
            <a href="bookings.html" data-page="bookings">
                <i class="fas fa-calendar-check"></i> Bookings
                <span class="badge" id="bookingBadge">0</span>
            </a>
            <a href="users.html" data-page="users">
                <i class="fas fa-users"></i> Users
                <span class="badge" id="userBadge">0</span>
            </a>

            <div class="nav-label" style="margin-top:0.8rem;">Management</div>
            <a href="payments.html" data-page="payments">
                <i class="fas fa-credit-card"></i> Payments
                <span class="badge" id="paymentBadge">0</span>
            </a>
            <a href="reports.html" data-page="reports">
                <i class="fas fa-chart-line"></i> Reports
            </a>
            <a href="reviews.html" data-page="reviews">
                <i class="fas fa-star"></i> Reviews
                <span class="badge" id="reviewBadge">0</span>
            </a>

            <div class="nav-label" style="margin-top:0.8rem;">System</div>
            <a href="profile.html" data-page="profile">
                <i class="fas fa-user-cog"></i> Profile
            </a>
            <a href="notifications.html" data-page="notifications">
                <i class="fas fa-bell"></i> Notifications
                <span class="badge" id="notificationBadge">0</span>
            </a>
            <a href="logs.html" data-page="logs">
                <i class="fas fa-history"></i> Logs
            </a>
            <a href="settings.html" data-page="settings">
                <i class="fas fa-cog"></i> Settings
            </a>
        </nav>

        <div class="sidebar-footer">
            <div class="avatar">AD</div>
            <div class="info">
                <div class="name">Admin</div>
                <div class="role">Super Admin</div>
            </div>
            <div class="logout" onclick="logoutUser();">
                <i class="fas fa-sign-out-alt"></i>
            </div>
        </div>
    </aside>

    <!-- ─── Main Content ─── -->
    <main class="main">

        <!-- ─── Top Bar ─── -->
        <div class="topbar">
            <div class="topbar-left">
                <h2>Car Details <span>✦</span></h2>
                <p><a class="back-link" href="manage-cars.html"><i class="fas fa-arrow-left"></i> Back to Cars</a></p>
            </div>
            <div class="topbar-right">
                <div class="date-badge">
                    <i class="fas fa-calendar-alt"></i>
                    <span id="currentDate"></span>
                </div>
            </div>
        </div>

        <!-- ─── Car Detail Container ─── -->
        <div id="carDetailContainer">
            <!-- Rendered by JavaScript -->
        </div>

        <!-- ─── Footer ─── -->
        <div style="margin-top:2.5rem;font-size:0.7rem;color:var(--text-dim);text-align:center;border-top:1px solid var(--card-border);padding-top:1.5rem;">
            &copy; 2026 Dream Universe Car Rentals — Admin Panel
        </div>

    </main>

    <!-- ─── Toast ─── -->
    <div class="toast" id="toast"></div>

    <!-- ─── JavaScript ─── -->
    <script>
        (function() {
            'use strict';

            // ─── DATA ───
            const CARS_KEY = 'dreamUniverseCars';
            let carsData = [];

            function loadCars() {
                const stored = localStorage.getItem(CARS_KEY);
                if (stored) {
                    try {
                        carsData = JSON.parse(stored);
                        return;
                    } catch (e) {}
                }
                carsData = [];
            }

            // ─── TOAST ───
            let toastTimeout;
            window.showToast = function(msg) {
                const el = document.getElementById('toast');
                el.textContent = msg;
                el.classList.add('show');
                clearTimeout(toastTimeout);
                toastTimeout = setTimeout(() => {
                    el.classList.remove('show');
                }, 2800);
            };

            // ─── LOGOUT ───
            window.logoutUser = function() {
                if (confirm('Are you sure you want to logout?')) {
                    window.location.href = 'login.html';
                }
            };

            // ─── DATE ───
            const dateEl = document.getElementById('currentDate');
            if (dateEl) {
                const now = new Date();
                const options = { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric' };
                dateEl.textContent = now.toLocaleDateString('en-IN', options);
            }

            // ─── SIDEBAR HIGHLIGHTING ───
            (function highlightSidebar() {
                const currentFile = window.location.pathname.split('/').pop().toLowerCase();
                const pageMap = {
                    'dashboard': ['dashboard', 'admin dashboard'],
                    'cars': ['cars', 'car'],
                    'bookings': ['bookings', 'booking'],
                    'users': ['users', 'user'],
                    'payments': ['payments', 'payment'],
                    'reports': ['reports', 'report'],
                    'reviews': ['reviews', 'review'],
                    'profile': ['profile'],
                    'notifications': ['notifications', 'notification'],
                    'logs': ['logs', 'log'],
                    'settings': ['settings', 'setting']
                };

                document.querySelectorAll('.sidebar-nav a[href]').forEach(function(link) {
                    const dataPage = link.getAttribute('data-page');
                    if (!dataPage) {
                        link.classList.remove('active');
                        return;
                    }
                    const patterns = pageMap[dataPage] || [dataPage];
                    const isMatch = patterns.some(function(pattern) {
                        return currentFile.includes(pattern);
                    });
                    if (isMatch) {
                        link.classList.add('active');
                    } else {
                        link.classList.remove('active');
                    }
                });
            })();

            // ─── SIDEBAR TOGGLE ───
            const hamburger = document.getElementById('hamburger');
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');

            function toggleSidebar() {
                sidebar.classList.toggle('open');
                overlay.classList.toggle('active');
            }

            hamburger.addEventListener('click', toggleSidebar);
            overlay.addEventListener('click', toggleSidebar);

            document.querySelectorAll('.sidebar-nav a').forEach(function(link) {
                link.addEventListener('click', function() {
                    if (window.innerWidth <= 768) {
                        sidebar.classList.remove('open');
                        overlay.classList.remove('active');
                    }
                });
            });

            window.addEventListener('resize', function() {
                if (window.innerWidth > 768) {
                    sidebar.classList.remove('open');
                    overlay.classList.remove('active');
                }
            });

            // ─── UPDATE BADGE ───
            function updateBadge() {
                const badge = document.getElementById('carBadge');
                if (badge) badge.textContent = carsData.length;
            }

            // ─── GET CAR ID FROM URL ───
            function getCarIdFromURL() {
                const params = new URLSearchParams(window.location.search);
                return params.get('id') || null;
            }

            // ─── RENDER CAR DETAIL ───
            function renderCarDetail() {
                const container = document.getElementById('carDetailContainer');
                const carId = getCarIdFromURL();

                if (!carId) {
                    container.innerHTML = `
                        <div class="no-data">
                            <i class="fas fa-exclamation-circle"></i>
                            <h3>No Car Selected</h3>
                            <p>Please select a car from the <a href="manage-cars.html">Cars list</a>.</p>
                        </div>
                    `;
                    return;
                }

                loadCars();
                const car = carsData.find(c => c.id == carId);

                if (!car) {
                    container.innerHTML = `
                        <div class="no-data">
                            <i class="fas fa-search"></i>
                            <h3>Car Not Found</h3>
                            <p>The car you're looking for doesn't exist or has been deleted.</p>
                            <a href="manage-cars.html" style="display:inline-block;margin-top:1rem;padding:0.5rem 1.5rem;background:linear-gradient(135deg,var(--gold-dark),var(--gold),var(--gold-light));border-radius:10px;color:#0b0a0a;text-decoration:none;font-weight:600;">View All Cars</a>
                        </div>
                    `;
                    return;
                }

                // Format data
                const statusClass = car.status || 'available';
                const imageUrl = car.image || 'https://images.unsplash.com/photo-1618843479313-40f8afb4b4d8?auto=format&fit=crop&w=600&q=80';
                const description = car.description || 'No description available for this vehicle.';
                const fuelType = car.fuelType || 'N/A';
                const transmission = car.transmission || 'N/A';
                const seats = car.seats || 'N/A';
                const make = car.make || 'N/A';
                const year = car.year || 'N/A';

                container.innerHTML = `
                    <div class="detail-grid">

                        <!-- ─── Left Column ─── -->
                        <div>

                            <!-- Car Image -->
                            <div class="panel">
                                <div class="car-image-large">
                                    <img src="${imageUrl}" alt="${car.name}" loading="lazy" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22600%22 height=%22300%22 viewBox=%220 0 600 300%22%3E%3Crect width=%22600%22 height=%22300%22 fill=%22%231a1818%22/%3E%3Ctext x=%2250%25%22 y=%2250%25%22 font-family=%22sans-serif%22 font-size=%2240%22 fill=%22%23555%22 text-anchor=%22middle%22 dy=%22.3em%22%3E🚗%3C/text%3E%3C/svg%3E'" />
                                </div>
                            </div>

                            <!-- Car Info -->
                            <div class="panel" style="margin-top:1.2rem;">
                                <div class="panel-header">
                                    <h3>Vehicle Information</h3>
                                    <span class="status-badge ${statusClass}">${statusClass}</span>
                                </div>
                                <div class="info-row">
                                    <span class="label">Name</span>
                                    <span class="value gold" style="font-size:1.1rem;">${car.name}</span>
                                </div>
                                <div class="info-row">
                                    <span class="label">Make / Brand</span>
                                    <span class="value">${make}</span>
                                </div>
                                <div class="info-row">
                                    <span class="label">Year</span>
                                    <span class="value">${year}</span>
                                </div>
                                <div class="info-row">
                                    <span class="label">Type</span>
                                    <span class="value">${car.type || 'N/A'}</span>
                                </div>
                                <div class="info-row">
                                    <span class="label">Transmission</span>
                                    <span class="value">${transmission}</span>
                                </div>
                                <div class="info-row">
                                    <span class="label">Fuel Type</span>
                                    <span class="value">${fuelType}</span>
                                </div>
                                <div class="info-row">
                                    <span class="label">Seats</span>
                                    <span class="value">${seats}</span>
                                </div>
                                <div class="info-row">
                                    <span class="label">Price per Day</span>
                                    <span class="value gold">₹${(car.price || 0).toLocaleString()}</span>
                                </div>
                                <div class="info-row" style="border-bottom:none;padding-bottom:0;">
                                    <span class="label">Description</span>
                                    <span class="value description-text">${description}</span>
                                </div>
                            </div>

                        </div>

                        <!-- ─── Right Column ─── -->
                        <div>

                            <!-- Actions -->
                            <div class="panel">
                                <div class="panel-header">
                                    <h3>Actions</h3>
                                </div>
                                <div class="action-buttons">
                                    <a href="car-add.html?id=${car.id}" class="btn-edit">
                                        <i class="fas fa-edit"></i> Edit Car
                                    </a>
                                    <button class="btn-toggle" onclick="toggleStatus(${car.id})">
                                        <i class="fas fa-sync-alt"></i> Toggle Status
                                    </button>
                                    <button class="btn-delete" onclick="deleteCar(${car.id})">
                                        <i class="fas fa-trash"></i> Delete Car
                                    </button>
                                </div>
                            </div>

                            <!-- Quick Stats -->
                            <div class="panel" style="margin-top:1.2rem;">
                                <div class="panel-header">
                                    <h3>Quick Stats</h3>
                                </div>
                                <div class="info-row">
                                    <span class="label">Car ID</span>
                                    <span class="value" style="font-size:0.7rem;color:var(--text-muted);">#${car.id}</span>
                                </div>
                                <div class="info-row">
                                    <span class="label">Status</span>
                                    <span class="value"><span class="status-badge ${statusClass}">${statusClass}</span></span>
                                </div>
                                <div class="info-row" style="border-bottom:none;">
                                    <span class="label">Daily Rate</span>
                                    <span class="value gold">₹${(car.price || 0).toLocaleString()}</span>
                                </div>
                            </div>

                            <!-- Add-ons (if any) -->
                            ${car.addons && car.addons.length > 0 ? `
                                <div class="panel" style="margin-top:1.2rem;">
                                    <div class="panel-header">
                                        <h3>Available Add-ons</h3>
                                    </div>
                                    ${car.addons.map(a => `
                                        <div class="info-row">
                                            <span class="label">${a.name}</span>
                                            <span class="value">₹${a.price}</span>
                                        </div>
                                    `).join('')}
                                    <div class="info-row" style="border-bottom:none;border-top:1px solid rgba(255,255,255,0.05);padding-top:0.5rem;margin-top:0.3rem;">
                                        <span class="label" style="font-weight:600;">Total Add-ons</span>
                                        <span class="value gold">₹${car.addons.reduce((sum, a) => sum + a.price, 0)}</span>
                                    </div>
                                </div>
                            ` : ''}

                        </div>

                    </div>
                `;

                updateBadge();
            }

            // ─── ACTIONS ───
            window.toggleStatus = function(id) {
                const car = carsData.find(c => c.id === id);
                if (!car) return;
                const statuses = ['available', 'booked', 'maintenance'];
                const currentIndex = statuses.indexOf(car.status);
                const nextIndex = (currentIndex + 1) % statuses.length;
                car.status = statuses[nextIndex];
                localStorage.setItem(CARS_KEY, JSON.stringify(carsData));
                renderCarDetail();
                showToast(`🔄 ${car.name} status changed to ${car.status}`);
            };

            window.deleteCar = function(id) {
                const car = carsData.find(c => c.id === id);
                if (!car) return;
                if (confirm(`Are you sure you want to delete "${car.name}"?`)) {
                    const index = carsData.findIndex(c => c.id === id);
                    if (index > -1) {
                        carsData.splice(index, 1);
                        localStorage.setItem(CARS_KEY, JSON.stringify(carsData));
                        showToast(`🗑️ ${car.name} has been deleted.`);
                        setTimeout(() => {
                            window.location.href = 'manage-cars.html';
                        }, 800);
                    }
                }
            };

            // ─── INIT ───
            loadCars();
            renderCarDetail();

            // Update badge
            updateBadge();

            console.log('✨ Car Detail page loaded.');

        })();
    </script>

</body>
</html>
