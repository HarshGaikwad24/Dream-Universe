<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dream Universe · Login</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,900;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

    <style>
        /* ─── Reset & Base ─── */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --gold: #c9a94e;
            --gold-light: #e8d48b;
            --gold-dark: #a8892e;
            --gold-glow: rgba(201, 169, 78, 0.35);
            --bg-dark: #0b0a0a;
            --bg-card: rgba(10, 10, 12, 0.78);
            --text-light: #f1efe8;
            --text-muted: rgba(255, 255, 255, 0.55);
            --text-dim: rgba(255, 255, 255, 0.25);
            --border-gold: rgba(201, 169, 78, 0.20);
            --card-border: rgba(255, 255, 255, 0.04);
            --shadow-card: 0 30px 80px rgba(0, 0, 0, 0.75);
            --radius: 16px;
        }

        html,
        body {
            height: 100%;
            font-family: 'Inter', sans-serif;
            background: var(--bg-dark);
            color: var(--text-light);
            overflow-y: auto;
            scroll-behavior: smooth;
        }

        /* ─── Background ─── */
        .bg-layer {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
        }

        .bg-image {
            position: absolute;
            inset: 0;
            z-index: 1;
            background: url('speed.jpeg') center center / cover no-repeat;
            transform: scale(1);
            animation: bgPulse 12s ease-in-out infinite alternate;
        }

        @keyframes bgPulse {
            0% {
                transform: scale(1);
                filter: brightness(0.95);
            }
            100% {
                transform: scale(1.04);
                filter: brightness(1.10);
            }
        }

        .bg-overlay {
            position: absolute;
            inset: 0;
            z-index: 2;
            background:
                radial-gradient(ellipse at 30% 20%, rgba(30, 20, 10, 0.60) 0%, rgba(0, 0, 0, 0.88) 90%),
                radial-gradient(ellipse at 0% 50%, rgba(201, 169, 78, 0.10) 0%, transparent 70%);
            pointer-events: none;
        }

        .bg-overlay::after {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at center, transparent 40%, rgba(0, 0, 0, 0.60) 100%);
            pointer-events: none;
        }

        /* ─── Particles ─── */
        .particle {
            position: fixed;
            pointer-events: none;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(201, 169, 78, 0.12), transparent 70%);
            animation: floatParticle 14s infinite alternate ease-in-out;
            z-index: 1;
        }

        @keyframes floatParticle {
            0% {
                transform: translate(0, 0) scale(1);
                opacity: 0.15;
            }
            100% {
                transform: translate(40px, -60px) scale(1.6);
                opacity: 0.40;
            }
        }

        /* ─── Main ─── */
        .login-wrapper {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem 4rem;
        }

        /* ─── Card ─── */
        .login-card {
            width: 100%;
            max-width: 480px;
            background: var(--bg-card);
            backdrop-filter: blur(18px) saturate(1.4);
            -webkit-backdrop-filter: blur(18px) saturate(1.4);
            border: 1px solid var(--border-gold);
            border-radius: 28px;
            padding: 2.8rem 2.8rem 2.6rem;
            box-shadow: var(--shadow-card), inset 0 1px 0 rgba(255, 255, 255, 0.04);
            animation: cardFadeIn 0.9s cubic-bezier(0.23, 1, 0.32, 1) both;
            transition: box-shadow 0.4s ease;
        }

        .login-card:hover {
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.85), inset 0 1px 0 rgba(255, 255, 255, 0.06);
        }

        @keyframes cardFadeIn {
            0% {
                opacity: 0;
                transform: translateY(30px) scale(0.96);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* ─── Brand ─── */
        .brand {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.6rem;
        }

        .brand-icon {
            font-size: 1.8rem;
            line-height: 1;
            color: var(--gold);
            filter: drop-shadow(0 0 12px var(--gold-glow));
            animation: goldShimmer 3s ease-in-out infinite alternate;
        }

        .brand-name {
            font-family: 'Playfair Display', serif;
            font-weight: 700;
            font-size: 1.6rem;
            letter-spacing: 0.04em;
            background: linear-gradient(135deg, var(--gold-light) 0%, var(--gold) 45%, var(--gold-dark) 80%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px rgba(201, 169, 78, 0.15);
            animation: goldShimmer 3.6s ease-in-out infinite alternate;
            line-height: 1.2;
        }

        .brand-sub {
            font-family: 'Playfair Display', serif;
            font-weight: 400;
            font-size: 0.7rem;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-top: -0.1rem;
            padding-left: 0.1rem;
            border-left: 2px solid var(--gold);
            padding-left: 0.7rem;
            opacity: 0.7;
        }

        @keyframes goldShimmer {
            0% {
                filter: drop-shadow(0 0 6px rgba(201, 169, 78, 0.20));
            }
            100% {
                filter: drop-shadow(0 0 22px rgba(201, 169, 78, 0.50));
            }
        }

        /* ─── Role Toggle ─── */
        .role-toggle {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.8rem;
            margin: 1rem 0 0.2rem;
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 500;
            letter-spacing: 0.04em;
        }

        .role-toggle .toggle-track {
            position: relative;
            width: 52px;
            height: 28px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            cursor: pointer;
            transition: background 0.3s ease, border-color 0.3s ease;
            flex-shrink: 0;
        }

        .role-toggle .toggle-track.active {
            background: rgba(201, 169, 78, 0.25);
            border-color: var(--gold);
        }

        .role-toggle .toggle-knob {
            position: absolute;
            top: 3px;
            left: 3px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--gold);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.3s ease;
            box-shadow: 0 2px 8px rgba(201, 169, 78, 0.3);
        }

        .role-toggle .toggle-track.active .toggle-knob {
            transform: translateX(24px);
            background: var(--gold-light);
        }

        .role-toggle .role-label {
            transition: color 0.3s ease;
        }

        .role-toggle .role-label.active {
            color: var(--gold-light);
        }

        .role-toggle .role-label:first-child {
            margin-right: -0.2rem;
        }
        .role-toggle .role-label:last-child {
            margin-left: -0.2rem;
        }

        /* ─── Welcome ─── */
        .welcome {
            margin: 1.4rem 0 0.2rem;
        }

        .welcome h2 {
            font-family: 'Playfair Display', serif;
            font-weight: 600;
            font-size: 1.6rem;
            letter-spacing: -0.01em;
            color: var(--text-light);
        }

        .welcome p {
            color: var(--text-muted);
            font-size: 0.92rem;
            font-weight: 300;
            margin-top: 0.2rem;
        }

        .welcome p span {
            color: var(--gold);
            font-weight: 400;
        }

        /* ─── Form ─── */
        .login-form {
            margin-top: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .form-group label {
            font-size: 0.78rem;
            font-weight: 500;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--text-muted);
            transition: color 0.3s ease;
        }

        .form-group:focus-within label {
            color: var(--gold-light);
        }

        .form-group input {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            padding: 0.85rem 1.2rem;
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            font-weight: 400;
            color: var(--text-light);
            transition: border-color 0.3s ease, box-shadow 0.3s ease, background 0.3s ease;
            outline: none;
            width: 100%;
        }

        .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.20);
            font-weight: 300;
        }

        .form-group input:focus {
            border-color: var(--gold);
            background: rgba(255, 255, 255, 0.07);
            box-shadow: 0 0 0 4px rgba(201, 169, 78, 0.06), inset 0 0 0 1px rgba(201, 169, 78, 0.10);
        }

        /* password toggle */
        .password-wrap {
            position: relative;
        }

        .password-wrap input {
            padding-right: 3.2rem;
        }

        .toggle-pw {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.1rem;
            cursor: pointer;
            padding: 0.2rem 0.4rem;
            transition: color 0.25s ease;
            opacity: 0.6;
        }

        .toggle-pw:hover {
            color: var(--gold-light);
            opacity: 1;
        }

        /* ─── Options ─── */
        .form-options {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 0.2rem 0 0.2rem;
            font-size: 0.85rem;
        }

        .form-options label {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-muted);
            cursor: pointer;
            font-weight: 400;
            transition: color 0.2s ease;
        }

        .form-options label:hover {
            color: var(--text-light);
        }

        .form-options input[type="checkbox"] {
            appearance: none;
            width: 16px;
            height: 16px;
            border: 1.5px solid rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            background: transparent;
            cursor: pointer;
            position: relative;
            transition: border-color 0.25s ease, background 0.25s ease;
            flex-shrink: 0;
        }

        .form-options input[type="checkbox"]:checked {
            border-color: var(--gold);
            background: var(--gold);
        }

        .form-options input[type="checkbox"]:checked::after {
            content: '✓';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 11px;
            color: #0b0a0a;
            font-weight: 700;
        }

        .form-options a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.85rem;
            transition: color 0.25s ease, text-shadow 0.25s ease;
            border-bottom: 1px solid transparent;
        }

        .form-options a:hover {
            color: var(--gold-light);
            text-shadow: 0 0 16px rgba(201, 169, 78, 0.20);
            border-bottom-color: rgba(201, 169, 78, 0.25);
        }

        /* ─── Sign In Button ─── */
        .btn-signin {
            margin-top: 0.6rem;
            padding: 0.95rem;
            font-family: 'Inter', sans-serif;
            font-weight: 700;
            font-size: 1rem;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            border: none;
            border-radius: 14px;
            background: linear-gradient(135deg, var(--gold-dark), var(--gold), var(--gold-light));
            color: #0b0a0a;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.35s ease, filter 0.3s ease;
            box-shadow: 0 4px 24px rgba(201, 169, 78, 0.20);
            position: relative;
            overflow: hidden;
            width: 100%;
        }

        .btn-signin::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.25), transparent 60%);
            opacity: 0;
            transition: opacity 0.5s ease;
            pointer-events: none;
        }

        .btn-signin:hover {
            transform: translateY(-2px) scale(1.01);
            box-shadow: 0 8px 40px rgba(201, 169, 78, 0.35);
            filter: brightness(1.06);
        }

        .btn-signin:hover::before {
            opacity: 1;
        }

        .btn-signin:active {
            transform: translateY(1px) scale(0.98);
            box-shadow: 0 2px 16px rgba(201, 169, 78, 0.20);
        }

        /* ─── Membership ─── */
        .membership {
            margin-top: 1.8rem;
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-muted);
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            padding-top: 1.6rem;
        }

        .membership p {
            line-height: 1.6;
        }

        .membership a {
            color: var(--gold-light);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s ease, text-shadow 0.3s ease;
            border-bottom: 1px solid transparent;
        }

        .membership a:hover {
            color: var(--gold);
            text-shadow: 0 0 20px rgba(201, 169, 78, 0.15);
            border-bottom-color: rgba(201, 169, 78, 0.20);
        }

        .membership .tagline {
            display: block;
            margin-top: 0.8rem;
            font-size: 0.7rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.15);
            font-weight: 300;
        }

        .membership .tagline span {
            color: var(--gold-dark);
        }

        /* ─── Responsive ─── */
        @media (max-width: 640px) {
            .login-wrapper {
                padding: 1.2rem;
            }
            .login-card {
                padding: 2rem 1.6rem 1.8rem;
                border-radius: 20px;
                max-width: 100%;
            }
            .brand-name {
                font-size: 1.3rem;
            }
            .welcome h2 {
                font-size: 1.3rem;
            }
            .form-options {
                flex-wrap: wrap;
                gap: 0.6rem;
            }
            .btn-signin {
                padding: 0.85rem;
            }
            .role-toggle {
                font-size: 0.7rem;
                gap: 0.5rem;
            }
            .role-toggle .toggle-track {
                width: 44px;
                height: 24px;
            }
            .role-toggle .toggle-knob {
                width: 18px;
                height: 18px;
                top: 2px;
                left: 2px;
            }
            .role-toggle .toggle-track.active .toggle-knob {
                transform: translateX(20px);
            }
        }

        @media (max-width: 420px) {
            .login-wrapper {
                padding: 0.8rem;
            }
            .login-card {
                padding: 1.4rem 1.2rem;
            }
            .brand-name {
                font-size: 1.1rem;
            }
            .brand-icon {
                font-size: 1.4rem;
            }
            .form-group input {
                padding: 0.7rem 1rem;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>

    <!-- ─── Background ─── -->
    <div class="bg-layer">
        <div class="bg-image" style="background-image: url('speed.jpeg');">
            <!-- 👆 Replace the URL above with your own image path -->
        </div>
        <div class="bg-overlay"></div>
    </div>

    <!-- ─── Particles ─── -->
    <div id="particles"></div>

    <!-- ─── Main ─── -->
    <div class="login-wrapper">

        <div class="login-card">

            <!-- Brand -->
            <div class="brand">
                <span class="brand-icon">✦</span>
                <span class="brand-name">Dream Universe</span>
                <span class="brand-sub">Car Rentals</span>
            </div>

            <!-- Role Toggle -->
            <div class="role-toggle">
                <span class="role-label" id="roleLabelCustomer">Customer</span>
                <div class="toggle-track" id="roleToggle">
                    <div class="toggle-knob"></div>
                </div>
                <span class="role-label" id="roleLabelAdmin">Admin</span>
            </div>

            <!-- Welcome -->
            <div class="welcome">
                <h2 id="welcomeTitle">Welcome back</h2>
                <p id="welcomeSub">Sign in to reserve your next <span>extraordinary</span> drive.</p>
            </div>

            <!-- Form -->
            <form class="login-form" id="loginForm" novalidate>
                <div class="form-group">
                    <label for="email" id="emailLabel">Email address</label>
                    <input type="email" id="email" placeholder="you@example.com" autocomplete="email" />
                </div>

                <div class="form-group">
                    <label for="password" id="passwordLabel">Password</label>
                    <div class="password-wrap">
                        <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password" />
                        <button type="button" class="toggle-pw" id="togglePw" aria-label="Toggle password visibility">
                            <span id="toggleIcon">👁</span>
                        </button>
                    </div>
                </div>

                <div class="form-options">
                    <label>
                        <input type="checkbox" checked />
                        Keep me signed in
                    </label>
                    <a href="#" id="forgotLink">Forgot password?</a>
                </div>

                <button type="submit" class="btn-signin" id="signinBtn">Sign In</button>
            </form>

            <!-- Membership -->
            <div class="membership" id="membershipSection">
                <p id="membershipText">
                    Don't have an account?
                    <a href="car registration.html" id="registerLink">Register</a>
                </p>
                <span class="tagline">
                    <span>✦</span> The world's finest automobiles, protected by bank‑grade encryption <span>✦</span>
                </span>
            </div>

        </div>
    </div>

    <!-- ─── JavaScript ─── -->
    <script>
        (function() {
            'use strict';

            // ─── Particles ───
            const container = document.getElementById('particles');
            for (let i = 0; i < 16; i++) {
                const el = document.createElement('div');
                el.className = 'particle';
                const size = 30 + Math.random() * 110;
                el.style.cssText =
                    `width:${size}px;height:${size}px;left:${Math.random()*100}%;top:${Math.random()*100}%;animation-delay:${Math.random()*12}s;animation-duration:${10+Math.random()*14}s;`;
                container.appendChild(el);
            }

            // ─── Toggle password ───
            const toggleBtn = document.getElementById('togglePw');
            const pwInput = document.getElementById('password');
            const toggleIcon = document.getElementById('toggleIcon');

            toggleBtn.addEventListener('click', function() {
                const isPassword = pwInput.type === 'password';
                pwInput.type = isPassword ? 'text' : 'password';
                toggleIcon.textContent = isPassword ? '🙈' : '👁';
            });

            // ─── Role Toggle ───
            const roleToggle = document.getElementById('roleToggle');
            const roleLabelCustomer = document.getElementById('roleLabelCustomer');
            const roleLabelAdmin = document.getElementById('roleLabelAdmin');
            const welcomeTitle = document.getElementById('welcomeTitle');
            const welcomeSub = document.getElementById('welcomeSub');
            const emailLabel = document.getElementById('emailLabel');
            const passwordLabel = document.getElementById('passwordLabel');
            const signinBtn = document.getElementById('signinBtn');
            const forgotLink = document.getElementById('forgotLink');
            const membershipSection = document.getElementById('membershipSection');

            let isAdmin = false;

            function updateUI(admin) {
                roleToggle.classList.toggle('active', admin);
                roleLabelCustomer.classList.toggle('active', !admin);
                roleLabelAdmin.classList.toggle('active', admin);

                if (admin) {
                    welcomeTitle.textContent = 'Admin Access';
                    welcomeSub.innerHTML = 'Sign in to manage your fleet and <span>oversee</span> operations.';
                    emailLabel.textContent = 'Admin Email';
                    passwordLabel.textContent = 'Admin Password';
                    signinBtn.textContent = 'Sign In as Admin';
                    forgotLink.textContent = 'Admin password recovery';
                    // Hide the membership section (Register link disappears)
                    membershipSection.style.display = 'none';
                } else {
                    welcomeTitle.textContent = 'Welcome back';
                    welcomeSub.innerHTML = 'Sign in to reserve your next <span>extraordinary</span> drive.';
                    emailLabel.textContent = 'Email address';
                    passwordLabel.textContent = 'Password';
                    signinBtn.textContent = 'Sign In';
                    forgotLink.textContent = 'Forgot password?';
                    // Show membership section with Register link
                    membershipSection.style.display = 'block';
                    // Ensure the register link points to car registration.html
                    const registerLink = document.getElementById('registerLink');
                    if (registerLink) {
                        registerLink.href = 'car registration.html';
                        registerLink.textContent = 'Register';
                    }
                }
            }

            roleToggle.addEventListener('click', function() {
                isAdmin = !isAdmin;
                updateUI(isAdmin);
            });

            // ─── Forgot password demo ───
            forgotLink.addEventListener('click', function(e) {
                e.preventDefault();
                if (isAdmin) {
                    alert('🔐 Admin password reset link would be sent to your admin email.\n(Demo interaction)');
                } else {
                    alert('🔐 A password reset link would be sent to your email.\n(Demo interaction)');
                }
            });

            // ─── Form submission ───
            const form = document.getElementById('loginForm');
            const emailInput = document.getElementById('email');

            form.addEventListener('submit', function(e) {
                e.preventDefault();
                const email = emailInput.value.trim();
                const password = pwInput.value.trim();

                if (!email || !password) {
                    if (!email) {
                        emailInput.style.borderColor = 'rgba(255,100,80,0.5)';
                        emailInput.style.boxShadow = '0 0 0 4px rgba(255,100,80,0.08)';
                        setTimeout(() => {
                            emailInput.style.borderColor = '';
                            emailInput.style.boxShadow = '';
                        }, 800);
                    }
                    if (!password) {
                        pwInput.style.borderColor = 'rgba(255,100,80,0.5)';
                        pwInput.style.boxShadow = '0 0 0 4px rgba(255,100,80,0.08)';
                        setTimeout(() => {
                            pwInput.style.borderColor = '';
                            pwInput.style.boxShadow = '';
                        }, 800);
                    }
                    form.style.animation = 'shake 0.4s ease';
                    setTimeout(() => { form.style.animation = ''; }, 500);
                    return;
                }

                const btn = form.querySelector('.btn-signin');
                const originalText = btn.textContent;
                btn.textContent = isAdmin ? 'Signing in as Admin …' : 'Signing in …';
                btn.disabled = true;
                btn.style.opacity = '0.7';

                setTimeout(() => {
                    btn.textContent = '✓ Welcome back!';
                    btn.style.background = 'linear-gradient(135deg, #2d7a4a, #3a9d5e)';
                    btn.style.color = '#fff';
                    btn.style.boxShadow = '0 4px 30px rgba(58, 157, 94, 0.3)';
                    btn.disabled = false;
                    // Show role-specific message
                    if (isAdmin) {
                        alert('✅ Admin login successful. Redirecting to admin dashboard...\n(Demo)');
                    } else {
                        alert('✅ Login successful. Redirecting to your account...\n(Demo)');
                    }
                    setTimeout(() => {
                        btn.textContent = originalText;
                        btn.style.background = '';
                        btn.style.color = '';
                        btn.style.boxShadow = '';
                        btn.style.opacity = '1';
                    }, 2200);
                }, 1400);
            });

            // ─── Shake keyframe ───
            if (!document.getElementById('shakeKeyframes')) {
                const style = document.createElement('style');
                style.id = 'shakeKeyframes';
                style.textContent = `
                            @keyframes shake {
                                0%, 100% { transform: translateX(0); }
                                20% { transform: translateX(-10px); }
                                40% { transform: translateX(10px); }
                                60% { transform: translateX(-6px); }
                                80% { transform: translateX(6px); }
                            }
                        `;
                document.head.appendChild(style);
            }

            // ─── Init ───
            updateUI(false); // default: customer

        })();
    </script>

</body>
</html>
